version: 2
updates:
  # Frontend (Vite/React) — npm
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Bundle minor/patch bumps into a single PR to cut noise
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Backend (FastAPI) — pip
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"
